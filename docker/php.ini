; إعدادات PHP للإنتاج داخل الحاوية (مضبوطة لخطة 256MB)

; رفع ملفات الكتب (PDF) — ترفع حدود PHP المنخفضة الافتراضية
upload_max_filesize = 60M
post_max_size = 65M
max_execution_time = 90

; حدّ ذاكرة معقول لا يتجاوز سعة الحاوية (الطلبات تُعالَج تتابعياً في artisan serve)
memory_limit = 128M

; opcache يقلّل استهلاك الذاكرة والمعالج بشكل كبير — مهم على الموارد المحدودة
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 48
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
